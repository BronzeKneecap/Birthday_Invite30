<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root { --bg-shift: -170px; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  height: 100vh; width: 100vw;
  overflow: hidden;
  background-image: url('InviteMeet.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-color: black;
  background-position: center calc(80% + var(--bg-shift));
  font-family: Georgia, serif;
  font-style: italic;
  position: relative;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.flash {
  position: fixed; inset: 0;
  background: rgba(255,255,220,0.12);
  opacity: 0; pointer-events: none; z-index: 5;
  transition: opacity 0.08s;
}
.flash.active { opacity: 1; }
.tap-indicator {
  position: fixed; bottom: 48px; left: 50%;
  transform: translateX(-50%);
  font-family: Georgia, serif; font-style: italic;
  font-size: 28px;
  color: rgba(255,255,255,0);
  pointer-events: none; z-index: 20;
  text-align: center; white-space: nowrap;
  transition: color 0.25s;
  letter-spacing: 10px;
}
.tap-indicator.show { color: rgba(255,255,255,0.85); }
.go-msg {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif; font-style: italic;
  font-size: 32px;
  color: rgba(255,255,255,0);
  pointer-events: none; z-index: 30;
  transition: color 0.3s; letter-spacing: 4px;
}
.go-msg.show { color: rgba(255,255,220,0.95); }
.rsvp-btn {
  position: absolute;
  top: calc(50vh + var(--bg-shift));
  left: 75%;
  transform: translateX(-50%);
  padding: 36px 72px; font-size: 52px;
  border: none; border-radius: 12px;
  cursor: pointer; background: black; color: white;
  font-family: Georgia, serif; font-style: italic;
  opacity: 0;
  animation: fadeInSlow 1s ease forwards;
  animation-delay: 2s; z-index: 10;
}
@keyframes fadeInSlow { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="tap-indicator" id="tapIndicator"></div>
<div class="go-msg" id="goMsg">✦  Initiating  ✦</div>
<button class="rsvp-btn"
  onclick="event.stopPropagation(); window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header'">
  RSVP
</button>
<script>
  const REQUIRED = 3;
  const DEST = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
  let count = 0, timer = null;
  const flash = document.getElementById('flash');
  const indicator = document.getElementById('tapIndicator');
  const goMsg = document.getElementById('goMsg');

  function doFlash() {
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 100);
  }

  document.body.addEventListener('click', function(e) {
    if (e.target.classList.contains('rsvp-btn')) return;
    count++;
    doFlash();
    if (timer) clearTimeout(timer);
    if (count >= REQUIRED) {
      indicator.classList.remove('show');
      goMsg.classList.add('show');
      setTimeout(() => { window.location.href = DEST; }, 700);
      return;
    }
    indicator.textContent = '✦'.repeat(count) + '◇'.repeat(REQUIRED - count);
    indicator.classList.add('show');
    timer = setTimeout(() => {
      count = 0;
      indicator.classList.remove('show');
    }, 3000);
  });
</script>
</body>
</html>
