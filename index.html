<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root { --bg-shift: -170px; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background-image: url('InviteMeet.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-color: black;
  background-position: center calc(80% + var(--bg-shift));
  font-family: Georgia, serif;
}

/* Invisible full-screen button — covers everything */
#tapBtn {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  z-index: 999;
  -webkit-tap-highlight-color: transparent;
  padding: 0; margin: 0;
  -webkit-appearance: none;
  appearance: none;
}

/* RSVP sits above the tap button */
#rsvpBtn {
  position: fixed;
  bottom: 40px;
  right: 40px;
  padding: 20px 40px;
  font-size: 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: black;
  color: white;
  font-family: Georgia, serif;
  font-style: italic;
  z-index: 50;
  opacity: 0;
  animation: fadeIn 1s ease forwards 2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* Progress dots */
#dots {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 48px;
  color: white;
  letter-spacing: 16px;
  pointer-events: none;
  z-index: 300;
  display: none;
  text-shadow: 0 0 20px gold;
}

/* Go message */
#goMsg {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  color: white;
  font-family: Georgia, serif;
  font-style: italic;
  pointer-events: none;
  z-index: 300;
  display: none;
  text-shadow: 0 0 30px gold;
  text-align: center;
}
</style>
</head>
<body>

<button id="tapBtn"></button>
<button id="rsvpBtn" onclick="window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header'">RSVP</button>
<div id="dots"></div>
<div id="goMsg">✦ Initiating ✦</div>

<script>
var count = 0;
var going = false;
var timer = null;

var btn   = document.getElementById('tapBtn');
var dots  = document.getElementById('dots');
var goMsg = document.getElementById('goMsg');

btn.onclick = function() {
  if (going) return;
  count++;

  if (timer) clearTimeout(timer);

  if (count >= 3) {
    going = true;
    btn.style.display = 'none';
    dots.style.display = 'none';
    goMsg.style.display = 'block';
    setTimeout(function() {
      window.location.href = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
    }, 800);
    return;
  }

  // Show filled dots
  var d = '';
  for (var i = 0; i < count; i++) d += '✦';
  for (var i = count; i < 3; i++) d += '◇';
  dots.textContent = d;
  dots.style.display = 'block';

  // Reset if no tap within 3 seconds
  timer = setTimeout(function() {
    count = 0;
    dots.style.display = 'none';
  }, 3000);
};
</script>
</body>
</html>
