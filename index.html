<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root {
  --bg-shift: -170px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background-color: black;
  font-family: Georgia, serif;
  font-style: italic;
  position: relative;
}

/* Full screen invite image */
.invite-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center calc(80% + var(--bg-shift));
  display: block;
}

/* Invisible tap target over the obelisk */
.obelisk-tap {
  position: absolute;
  top: calc(50% + var(--bg-shift));
  left: 50%;
  transform: translate(-50%, -50%);
  width: 140px;
  height: 280px;
  cursor: pointer;
  z-index: 10;
  /* Uncomment below to debug the tap zone: */
  /* border: 2px solid red; */
}

/* Tap counter indicator */
.tap-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 18px;
  color: rgba(255,255,255,0);
  transition: color 0.3s;
  pointer-events: none;
  z-index: 20;
  text-align: center;
  white-space: nowrap;
}

.tap-indicator.show {
  color: rgba(255,255,255,0.7);
}

/* Flash effect on tap */
.flash {
  position: absolute;
  inset: 0;
  background: rgba(255,255,220,0.15);
  opacity: 0;
  pointer-events: none;
  z-index: 5;
  transition: opacity 0.1s;
}
.flash.active { opacity: 1; }

/* RSVP button (existing) */
.rsvp-btn {
  position: absolute;
  top: calc(50vh + var(--bg-shift));
  left: 75%;
  transform: translateX(-50%);
  padding: 36px 72px;
  font-size: 52px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: black;
  color: white;
  transition: transform 0.2s ease, background 0.3s ease;
  font-family: Georgia, serif;
  font-style: italic;
  opacity: 0;
  animation: fadeInSlow 1s ease forwards;
  animation-delay: 2s;
  z-index: 10;
}

.rsvp-btn:hover {
  transform: translateX(-50%) scale(1.05);
  background: black;
}

@keyframes fadeInSlow {
  from { opacity: 0; }
  to   { opacity: 1; }
}
</style>
</head>
<body>

<img src="InviteMeet.jpg" class="invite-img" alt="Jon's 30th Birthday Mystery Invite">
<div class="flash" id="flash"></div>

<!-- Invisible tap zone over the obelisk -->
<div class="obelisk-tap" id="obeliskTap"></div>

<!-- Tap counter feedback -->
<div class="tap-indicator" id="tapIndicator"></div>

<!-- RSVP button -->
<button class="rsvp-btn"
  onclick="window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header'">
  RSVP
</button>

<script>
  const REQUIRED_TAPS = 3;
  const REDIRECT_URL = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';

  let tapCount = 0;
  let resetTimer = null;

  const tapZone = document.getElementById('obeliskTap');
  const indicator = document.getElementById('tapIndicator');
  const flash = document.getElementById('flash');

  function doFlash() {
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 120);
  }

  function showIndicator(text) {
    indicator.textContent = text;
    indicator.classList.add('show');
  }

  function hideIndicator() {
    indicator.classList.remove('show');
  }

  tapZone.addEventListener('click', function() {
    tapCount++;
    doFlash();

    // Clear the reset timer on each tap
    if (resetTimer) clearTimeout(resetTimer);

    if (tapCount >= REQUIRED_TAPS) {
      showIndicator('✦  Initiating...  ✦');
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 600);
      return;
    }

    // Show progress
    const dots = '✦'.repeat(tapCount) + '◇'.repeat(REQUIRED_TAPS - tapCount);
    showIndicator(dots);

    // Reset if no tap within 3 seconds
    resetTimer = setTimeout(() => {
      tapCount = 0;
      hideIndicator();
    }, 3000);
  });
</script>

</body>
</html>
