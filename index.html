<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}
img#invite {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
#msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 36px;
  color: white;
  text-shadow: 0 0 30px gold;
  display: none;
  text-align: center;
  pointer-events: none;
}
#rsvp {
  position: fixed;
  bottom: 30px;
  right: 30px;
  padding: 18px 36px;
  font-size: 24px;
  font-family: Georgia, serif;
  font-style: italic;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  opacity: 0;
  animation: show 1s forwards 2s;
}
@keyframes show { to { opacity: 1; } }
</style>
</head>
<body>

<img id="invite" src="InviteMeet.jpg" alt="">
<div id="msg">✦ Initiating ✦</div>
<button id="rsvp">RSVP</button>

<script>
var taps = 0;
var t = null;

document.getElementById('rsvp').addEventListener('click', function(e) {
  e.stopPropagation();
  window.location.href = 'https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header';
});

document.getElementById('invite').addEventListener('click', function() {
  taps++;
  if (t) clearTimeout(t);
  if (taps >= 3) {
    document.getElementById('msg').style.display = 'block';
    setTimeout(function() {
      window.location.href = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
    }, 800);
    return;
  }
  t = setTimeout(function() { taps = 0; }, 3000);
});

document.getElementById('invite').addEventListener('touchend', function(e) {
  e.preventDefault();
  taps++;
  if (t) clearTimeout(t);
  if (taps >= 3) {
    document.getElementById('msg').style.display = 'block';
    setTimeout(function() {
      window.location.href = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
    }, 800);
    return;
  }
  t = setTimeout(function() { taps = 0; }, 3000);
});
</script>
</body>
</html>
