<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root { --bg-shift: -170px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}
img#invite {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
#msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 36px;
  color: white;
  text-shadow: 0 0 30px gold;
  display: none;
  text-align: center;
  pointer-events: none;
}
.rsvp-btn {
  position: absolute;
  top: calc(50vh + var(--bg-shift));
  left: 75%;
  transform: translateX(-50%);
  padding: 36px 72px;
  font-size: 52px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: black;
  color: white;
  transition: transform 0.2s ease;
  font-family: Georgia, serif;
  font-style: italic;
  opacity: 0;
  animation: fadeInSlow 1s ease forwards;
  animation-delay: 2s;
}
@keyframes fadeInSlow {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>

<img id="invite" src="InviteMeet.jpg" alt="">
<div id="msg">✦ Initiating ✦</div>
<button class="rsvp-btn" onclick="window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header'">RSVP</button>

<script>
var taps = 0;
var t = null;

document.getElementById('invite').addEventListener('touchend', function(e) {
  e.preventDefault();
  taps++;
  if (t) clearTimeout(t);
  if (taps >= 3) {
    document.getElementById('msg').style.display = 'block';
    setTimeout(function() {
      window.location.href = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
    }, 800);
    return;
  }
  t = setTimeout(function() { taps = 0; }, 3000);
});

document.getElementById('invite').addEventListener('click', function() {
  taps++;
  if (t) clearTimeout(t);
  if (taps >= 3) {
    document.getElementById('msg').style.display = 'block';
    setTimeout(function() {
      window.location.href = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';
    }, 800);
    return;
  }
  t = setTimeout(function() { taps = 0; }, 3000);
});
</script>
</body>
</html>
