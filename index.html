<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root { --bg-shift: -170px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background-image: url('InviteMeet.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-color: black;
  background-position: center calc(80% + var(--bg-shift));
  font-family: Georgia, serif;
  font-style: italic;
  cursor: pointer;
}

#counter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  color: white;
  font-weight: bold;
  display: none;
  z-index: 999;
  text-shadow: 0 0 30px gold;
  pointer-events: none;
}

#msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  color: white;
  display: none;
  z-index: 999;
  text-shadow: 0 0 30px gold;
  pointer-events: none;
  text-align: center;
  font-family: Georgia, serif;
  font-style: italic;
}

.rsvp-btn {
  position: fixed;
  bottom: 40px;
  right: 40px;
  padding: 20px 40px;
  font-size: 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: black;
  color: white;
  font-family: Georgia, serif;
  font-style: italic;
  z-index: 9999;
  opacity: 0;
  animation: fadeIn 1s ease forwards 2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div id="counter"></div>
<div id="msg">✦ Initiating ✦</div>

<button class="rsvp-btn" id="rsvpBtn">RSVP</button>

<script>
var count = 0;
var going = false;
var timer = null;
var DEST = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';

var counter = document.getElementById('counter');
var msg = document.getElementById('msg');

document.getElementById('rsvpBtn').addEventListener('touchstart', function(e) {
  e.stopPropagation();
  window.location.href = 'https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header';
}, {passive: true});

document.addEventListener('touchstart', function(e) {
  if (going) return;
  if (e.target.id === 'rsvpBtn') return;

  count++;

  // Show big number in center of screen
  counter.textContent = count;
  counter.style.display = 'block';

  if (timer) clearTimeout(timer);

  if (count >= 3) {
    going = true;
    counter.style.display = 'none';
    msg.style.display = 'block';
    setTimeout(function() {
      window.location.href = DEST;
    }, 800);
    return;
  }

  // Reset counter after 3 seconds
  timer = setTimeout(function() {
    count = 0;
    counter.style.display = 'none';
  }, 3000);

}, {passive: true});

// Desktop fallback
document.addEventListener('click', function(e) {
  if (going) return;
  if (e.target.id === 'rsvpBtn') return;
  if ('ontouchstart' in window) return;

  count++;
  counter.textContent = count;
  counter.style.display = 'block';

  if (timer) clearTimeout(timer);

  if (count >= 3) {
    going = true;
    counter.style.display = 'none';
    msg.style.display = 'block';
    setTimeout(function() { window.location.href = DEST; }, 800);
    return;
  }

  timer = setTimeout(function() {
    count = 0;
    counter.style.display = 'none';
  }, 3000);
});
</script>
</body>
</html>
