<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jon's 30th Birthday Mystery</title>
<style>
:root { --bg-shift: -170px; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  height: 100vh; width: 100vw;
  overflow: hidden;
  background-image: url('InviteMeet.jpg');
  background-size: contain;
  background-repeat: no-repeat;
  background-color: black;
  background-position: center calc(80% + var(--bg-shift));
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* Full screen tap overlay — sits on top of everything except RSVP */
#tapOverlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: transparent;
  touch-action: manipulation;
}

/* Flash */
#flash {
  position: fixed; inset: 0;
  background: rgba(255,255,200,0.25);
  opacity: 0; pointer-events: none; z-index: 60;
}

/* Symbols */
#tapIndicator {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 36px;
  color: white;
  letter-spacing: 12px;
  pointer-events: none;
  z-index: 70;
  display: none;
  text-shadow: 0 0 12px rgba(255,220,100,0.8);
}

/* Go message */
#goMsg {
  position: fixed; inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 32px;
  color: rgba(255,255,220,0.95);
  pointer-events: none;
  z-index: 70;
  text-shadow: 0 0 20px rgba(255,220,100,0.9);
  letter-spacing: 4px;
}

/* RSVP */
.rsvp-btn {
  position: absolute;
  top: calc(50vh + var(--bg-shift));
  left: 75%;
  transform: translateX(-50%);
  padding: 36px 72px;
  font-size: 52px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: black;
  color: white;
  font-family: Georgia, serif;
  font-style: italic;
  opacity: 0;
  animation: fadeIn 1s ease forwards 2s;
  z-index: 80;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div id="tapOverlay"></div>
<div id="flash"></div>
<div id="tapIndicator"></div>
<div id="goMsg">✦ &nbsp; Initiating &nbsp; ✦</div>

<button class="rsvp-btn"
  onclick="window.location.href='https://docs.google.com/forms/d/e/1FAIpQLSdWTnVV8zHDkQTZHpY8K-qGF9gMZ8ZLMHU7Y6ENkYfcR8B5BA/viewform?usp=header'">
  RSVP
</button>

<script>
const REQUIRED = 3;
const DEST = 'https://bronzekneecap.github.io/30thDegree/p00-clue.html';

let count = 0;
let timer = null;
let going = false;

const overlay   = document.getElementById('tapOverlay');
const flash     = document.getElementById('flash');
const indicator = document.getElementById('tapIndicator');
const goMsg     = document.getElementById('goMsg');

function doFlash() {
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; }, 120);
}

function updateIndicator() {
  const filled = '✦'.repeat(count);
  const empty  = '◇'.repeat(REQUIRED - count);
  indicator.textContent = filled + empty;
  indicator.style.display = 'block';
}

function go() {
  going = true;
  indicator.style.display = 'none';
  goMsg.style.display = 'flex';
  setTimeout(() => { window.location.href = DEST; }, 800);
}

// Use touchstart for instant mobile response
overlay.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (going) return;

  count++;
  doFlash();

  if (timer) clearTimeout(timer);

  if (count >= REQUIRED) {
    go();
    return;
  }

  updateIndicator();

  // Reset after 3 seconds of no taps
  timer = setTimeout(() => {
    count = 0;
    indicator.style.display = 'none';
  }, 3000);
}, { passive: false });

// Also handle mouse clicks for desktop testing
overlay.addEventListener('click', function(e) {
  if (going) return;
  // Only fire on desktop (touchstart handles mobile)
  if ('ontouchstart' in window) return;

  count++;
  doFlash();
  if (timer) clearTimeout(timer);
  if (count >= REQUIRED) { go(); return; }
  updateIndicator();
  timer = setTimeout(() => { count = 0; indicator.style.display = 'none'; }, 3000);
});
</script>

</body>
</html>
